plugins { id 'com.android.application' }

android {
    namespace 'com.texiol.dexk'
    compileSdk 36

    defaultConfig {
        applicationId 'com.texiol.dexk'
        minSdk 28
        targetSdk 36
        versionCode 21
        versionName '2.1.0'
    }

    signingConfigs {
        release {
            def keyStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keyStorePath != null && !keyStorePath.trim().isEmpty()) {
                storeFile file(keyStorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_PATH') != null && !System.getenv('ANDROID_KEYSTORE_PATH').trim().isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        checkDependencies false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'net.i2p.crypto:eddsa:0.3.0'
}
